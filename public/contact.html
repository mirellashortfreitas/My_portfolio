<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get in touch | Mirella Short Freitas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="logo">Mirella</a>
    <nav>
      <a href="index.html">Home</a>
      <button id="theme-toggle" aria-label="Toggle dark mode">🌙</button>
    </nav>
  </header>

  <main>
    <section class="contact-page">
      <h2>Get in touch</h2>
      <p class="contact-intro">Have a question or an opportunity in mind? Send me a message and I will get back to you as soon as possible.</p>

      <form id="contact-form">
        <div class="form-field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required maxlength="80">
        </div>

        <div class="form-field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required maxlength="120">
        </div>

        <div class="form-field">
          <label for="message">Message</label>
          <textarea id="message" name="message" required minlength="10" maxlength="2000"></textarea>
        </div>

        <div class="hp" aria-hidden="true">
          <label for="website">Leave this field empty</label>
          <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
        </div>

        <button type="submit" class="btn">Send message</button>
        <p id="form-status" role="status"></p>
      </form>
    </section>
  </main>

  <script src="js/theme.js"></script>
</body>
</html>
